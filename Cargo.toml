[package]
name = "pico-playground"
version = "0.1.0"
edition = "2024"

[dependencies]
embassy-executor = "=0.10.0"
embassy-time = "=0.5.1"

embassy-rp = { version = "=0.10.0", features = [
  "rp2040",
  "time-driver",
  "critical-section-impl",
  "executor-thread",
] }

embassy-futures = "=0.1.2"
embassy-sync = "=0.8.0"

cortex-m-rt = "0.7.7"
panic-halt = "1.0.0"
embassy-net = { version = "=0.9.1", features = [
  "udp",
  "dhcpv4",
  "dhcpv4-hostname",
  "medium-ethernet",
] }
embassy-net-wiznet = "=0.3.0"
embedded-hal-bus = { version = "=0.3.0", features = ["async"] }
static_cell = "=2.1.1"
portable-atomic = { version = "1.15.0", features = ["critical-section"] }
